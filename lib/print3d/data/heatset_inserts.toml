# Heat-set inserts (knurled brass, the common ruthex / CNC Kitchen geometry).
# d1 = knurl OD, d2 = tip OD, length = L, wall = minimum wall around the hole,
# hole = datasheet hole (for a drilled hole; printed holes add heatset_oversize).
# Depth of the hole: at least length + 1 mm.
# `default = true` marks the insert used when only the thread is given.

[inserts."M2x4"]
thread = "M2"
d1 = 3.6
d2 = 3.1
length = 4.0
wall = 1.3
hole = 3.2
default = true

[inserts."M2.5x5.7"]
thread = "M2.5"
d1 = 4.6
d2 = 3.9
length = 5.7
wall = 1.6
hole = 4.0
default = true

[inserts."M3x4"]
thread = "M3"
aliases = ["M3 short", "M3S", "M3Sx4"]
d1 = 4.6
d2 = 3.9
length = 4.0
wall = 1.6
hole = 4.0

